<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f0e5">
<title>Steep</title>
<style>
:root{--bg:#f7f0e5;--card:#fffaf1;--brown:#73523f;--text:#443830;--muted:#8e8177;--sage:#dfe8d8;--peach:#f3d0bf;--line:#ded3c4}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;padding:42px 28px 118px}.header{display:flex;justify-content:space-between;align-items:flex-start}.logo{font:700 76px Georgia,serif;color:var(--brown);line-height:.9}.tag{font:italic 28px Georgia,serif;color:#8d7667;margin-top:12px}.count{background:var(--sage);padding:12px 20px;border-radius:28px;font-size:20px}
.card{background:var(--card);border:2px solid var(--line);border-radius:38px;padding:30px;margin-top:30px}.card h2,.shelf-title{font:700 42px Georgia,serif;color:var(--brown);margin:0 0 22px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toggleline{grid-column:1/-1;display:flex;gap:12px;align-items:center;font-weight:650;font-size:20px}.toggleline input{width:34px;height:34px}
.segment{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 5px}.seg{border:0;border-radius:24px;background:var(--sage);padding:11px 15px;font-size:16px;color:var(--brown);font-weight:650}.seg.active{background:var(--brown);color:white}
button{font:inherit}.action{border:0;border-radius:24px;padding:20px 10px;font-size:18px;font-weight:700;color:var(--brown);background:var(--sage)}.action.primary{background:var(--brown);color:white}.action.peach{background:var(--peach)}
.rec h3,.tea h3{font:700 40px Georgia,serif;color:var(--brown);margin:8px 0}.eyebrow{color:var(--muted);font-size:18px}.brand{font-size:25px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.chip{background:var(--sage);padding:9px 14px;border-radius:22px}.chip.peach{background:var(--peach)}.note{font-size:20px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.smallbtn{border:0;border-radius:22px;padding:15px 18px;font-weight:700;background:var(--sage);color:var(--brown)}.smallbtn.dark{background:var(--brown);color:white}
.searchrow{display:grid;grid-template-columns:2fr 1fr;gap:10px}.field,select,textarea,input[type=text]{width:100%;font-size:20px;padding:15px;border:2px solid var(--line);border-radius:20px;background:white}.tea{padding:18px 0;border-bottom:2px solid var(--line)}.tea h3{font-size:29px;margin:0}.meta{color:var(--muted);font-size:18px}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,250,241,.96);border-top:2px solid var(--line);display:flex;justify-content:center;padding:14px max(18px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom));gap:8px}.nav button{width:min(31%,230px);border:0;border-radius:24px;padding:17px 5px;background:transparent;color:var(--brown);font-weight:700}.nav button.active{background:var(--sage)}
.hidden{display:none!important}.modal{position:fixed;inset:0;background:#665d5688;z-index:5;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--bg);width:min(760px,100%);max-height:91vh;overflow:auto;border-radius:38px 38px 0 0;padding:30px 28px calc(34px + env(safe-area-inset-bottom))}.sheet h2{font:700 38px Georgia,serif;color:var(--brown);margin:0 0 18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid label{font-weight:700;color:var(--brown)}.span2{grid-column:1/-1}.logitem{padding:18px 0;border-bottom:2px solid var(--line)}.logitem h3{font:700 26px Georgia,serif;color:var(--brown);margin:0 0 5px}.logmeta{color:var(--muted)}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
@media(max-width:500px){.app{padding:38px 16px 112px}.logo{font-size:58px}.tag{font-size:22px}.card{padding:22px 18px;border-radius:30px}.card h2,.shelf-title{font-size:34px}.action{font-size:16px}.rec h3{font-size:34px}.formgrid{grid-template-columns:1fr}.span2{grid-column:1}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div><div class="logo">Steep</div><div class="tag">all I need is tea and a book</div></div><div class="count" id="count"></div></header>

<section id="home">
<div class="card"><h2>What should I drink?</h2><div class="controls">
<label class="toggleline"><input type="checkbox" id="cranky"> My stomach is cranky</label>
<label class="toggleline"><input type="checkbox" id="quick"> ⚡ Quick & easy</label>
<div class="segment" id="cafSeg"><button class="seg active" data-caf="Any">Any caffeine</button><button class="seg" data-caf="Caffeinated">Need caffeine</button><button class="seg" data-caf="Decaf">Decaf / herbal</button></div>
<button class="action primary" data-mode="best">Best Pick</button><button class="action" data-mode="different">Something Different</button>
<button class="action peach" data-mode="useup">Use Something Up</button><button class="action" data-mode="wild">Wildcard</button>
</div></div>
<div id="recommendation"></div>
<div class="card" id="collection"><h2>Collection</h2><div class="stats" id="stats"></div><div style="color:var(--muted)">Maybe is conditional. Unknown stays separate.</div></div>
</section>

<section id="shelf" class="hidden">
<div class="card"><div style="display:flex;justify-content:space-between;gap:15px"><div><h2 class="shelf-title">Tea Shelf</h2><div style="color:var(--muted);font-size:19px">Tap any tea to log, edit, or update stock.</div></div><button class="smallbtn dark" id="addTea">+ Add Tea</button></div>
<div class="searchrow" style="margin-top:22px"><input class="field" id="search" placeholder="Search…"><select id="filter"><option>All</option><option>Favorites</option><option>Use Up</option><option>Gentle / Go-To</option><option>Backstock</option></select></div>
<div id="teaList"></div></div>
</section>

<section id="log" class="hidden">
<div class="card"><h2>Tea Log</h2><div style="color:var(--muted);font-size:19px;margin-bottom:18px">Because sometimes the tea was memorable and sometimes your brain said ✨ goodbye ✨.</div>
<div class="searchrow"><input class="field" id="logSearch" placeholder="Filter by tea…"><select id="logRange"><option value="all">All time</option><option value="30">Last 30 days</option><option value="7">Last 7 days</option></select></div>
<div class="stats" id="logStats"></div><div id="logList"></div></div>
</section>
</div>

<nav class="nav"><button class="active" data-page="home">⌂ Home</button><button data-page="shelf">☕ Tea Shelf</button><button data-page="log">☷ Tea Log</button></nav>
<div id="modal"></div>

<script>
const seed=[
["40 Winks","Adagio","Tea Cabinet","3/4","Gentle","Like","Yes","Normal","Herbal","Loose leaf","","Calming","Decaf","Easy"],
["Aries","Adagio","Tea Cabinet","Full","Avoid","Like","Maybe","Normal","Black","Loose leaf","","","Caffeinated","Easy"],
["Bella Luna","Adagio","Tea Drawer","Full","Avoid","Favorite","Yes","Limited / Conserve","Black","Loose leaf","","Full moon restock","Caffeinated","Easy"],
["Bella Luna Blue","Adagio","Tea Cabinet","3/4","Maybe","Like","Maybe","Limited / Conserve","Herbal","Loose leaf","","","Decaf","Easy"],
["Berry Creme Compote","Adagio","Tea Cabinet","1/2","Gentle","Like","Maybe","Normal","Herbal","Loose leaf","","Great mixed with Harney Vanilla","Decaf","Easy"],
["Black Cask Bourbon","Harney & Sons","Tea Drawer","3/4","Avoid","Neutral","No","Use Up","Black","Loose leaf","","Pair with Harney Vanilla","Caffeinated","Easy"],
["Bourbon Vanilla","Paromi","Tea Cabinet","Full","Avoid","Favorite","Yes","Normal","Black","Sachet","","Hard to find; Fresh Market","Caffeinated","Instant"],
["Casablanca Twist","Adagio","Tea Cabinet","3/4","Gentle","Favorite","Yes","Normal","Green","Loose leaf","","Spearmint; preferred over peppermint","Caffeinated","Easy"],
["Chamomile & Lavender","Traditional Medicinals","Tea Cabinet","Full","Go-To","Like","Yes","Normal","Herbal","Tea bag","","Calming","Decaf","Instant"],
["Chill","The Hemp Division / Harney & Sons","Tea Cabinet","Full","Gentle","Like","No","Use Up","Herbal","Sachet","","Retiring CBD collection","Decaf","Instant"],
["Decaf Hot Cinnamon Spice","Harney & Sons","Tea Cabinet","1/2","Maybe","Favorite","Yes","Forgotten","Black","Sachet","","Cinnamon and ginger may be good; depends on the day","Decaf","Instant"],
["Eternal Spring + Blood Orange","Adagio","Tea Cabinet","1/4","Maybe","Favorite","Yes","Normal","White + Herbal","Loose leaf","Yes","Daily go-to; bulk backup","Caffeinated","Easy"],
["Green Hot Cinnamon Spice","Harney & Sons","Tea Cabinet","1/4","Maybe","Neutral","No","Use Up","Green","Loose leaf","","Prefer black version","Caffeinated","Easy"],
["Hazelberry Pu-erh","Adagio","Tea Drawer","1/4","Maybe","Favorite","Yes","Normal","Pu-erh","Loose leaf","Yes","Daily go-to","Caffeinated","Easy"],
["Hot Cinnamon Spice","Harney & Sons","Tea Drawer","1/2","Avoid","Favorite","Yes","Normal","Black","Loose leaf","Yes","Cold-weather favorite; year-round","Caffeinated","Easy"],
["Mango & Pineapple","Twinings","Tea Drawer","Full","Gentle","Like","Yes","Normal","Herbal","Tea bag","","Good in hot toddies with Drambuie","Decaf","Instant"],
["Mango Ginger","Yogi","Hall Pantry","Full","Go-To","Favorite","Yes","Normal","Herbal","Tea bag","","Move to drawer when space opens; stomach-day go-to","Decaf","Instant"],
["Matcha Chocolate","Adagio","Tea Drawer","Full","Avoid","Like","Maybe","Normal","Matcha","Powder","","Winter; add oat milk/creamer","Caffeinated","Ritual"],
["Moroccan Mint","The Republic of Tea","Tea Drawer","1/4","Avoid","Neutral","No","Use Up","Green","Loose leaf","","Prefer Casablanca Twist","Caffeinated","Easy"],
["Peach & Blueberry Cobbler","Adagio","Tea Drawer","1/2","Gentle","Like","Maybe","Normal","Green blend","Loose leaf","Yes","Summer; bulk backup","Caffeinated","Easy"],
["Peach Oolong","Adagio","Tea Cabinet","Full","Avoid","Favorite","Yes","Normal","Oolong","Loose leaf","","Summer favorite","Caffeinated","Easy"],
["Peachy White","Adagio","Tea Cabinet","1/4","Gentle","Like","Yes","Finish Soon / Forgotten","White","Loose leaf","","Gentle caffeinated option","Caffeinated","Easy"],
["Pu-erh Chorange","Adagio","Tea Cabinet","3/4","Avoid","Like","Yes","Normal","Pu-erh","Loose leaf","","Terry's Chocolate Orange vibe; cool weather","Caffeinated","Easy"],
["Spiced Apple Chai","","Tea Drawer","1/2","Avoid","Favorite","Yes","Normal","Black / Chai","Loose leaf","","Fall/winter favorite","Caffeinated","Easy"],
["Sweet Strawberry Matcha","The Republic of Tea","Tea Cabinet","1/4","Avoid","Favorite","Yes","Normal","Matcha","Powder","","Matcha favorite; iced with oat milk","Caffeinated","A Few Steps"],
["Traditional Masala Chai","","Tea Cabinet","1/2","Avoid","Favorite","Yes","Normal","Black / Chai","Loose leaf","","Favorite; usually buy 3 oz","Caffeinated","Easy"],
["Vanilla","Harney & Sons","Tea Drawer","1/2","Avoid","Favorite","Yes","Normal","Black","Sachet","Yes","Daily go-to; pair with Black Cask Bourbon or Berry Creme Compote","Caffeinated","Instant"],
["Victorian London Fog","Harney & Sons","Tea Drawer","1/4","Avoid","Like","Yes","Finish Soon","Black","Loose leaf","","Half-and-half or creamer for latte feel","Caffeinated","Easy"],
["Wild Berries","Twinings","Tea Drawer","1/2","Gentle","Like","Yes","Normal","Herbal","Tea bag","1 backup in Hall Pantry","","Decaf","Instant"],
["Wild Sweet Orange","Tazo","Hall Pantry","Full","Gentle","Like","Maybe","Normal","Herbal","Tea bag","","","Decaf","Instant"],
["Sweet Strawberry Matcha","Republic of Tea","Tea Cabinet","1/4","Avoid","Favorite","Yes","Normal","Matcha","Powder","","Warm-weather matcha favorite","Caffeinated","A Few Steps"],
["Cream of Earl Grey","Traditional Medicinals","Tea Cabinet","3/4","No","Like","No","Normal","Black","Tea bag","","","Caffeinated","Instant"],
["White Blueberry","Adagio","Tea Cabinet","3/4","Gentle","Like","Yes","Normal","White","Loose leaf","","","Caffeinated","Easy"],
["Cacao","","Tea Cabinet","Full","Unknown","Like","Maybe","Normal","Herbal","Loose leaf","","","Decaf","Easy"],
["Irish Breakfast","","Tea Cabinet","3/4","Unknown","Like","Maybe","Normal","Black","Tea bag","","","Caffeinated","Instant"]
].map((a,i)=>({id:"seed"+i,name:a[0],brand:a[1],location:a[2],amount:a[3],gentle:a[4],preference:a[5],buyAgain:a[6],status:a[7],type:a[8],format:a[9],backstock:a[10],notes:a[11],caffeine:a[12],ease:a[13]}));

/* v3 migration: retain the user's current browser inventory/history if present.
   Multiple likely legacy keys are checked so v2 edits are not intentionally discarded. */
function loadExisting(){
  const keys=["steep_teas","steepTeas","teaInventory","steep_inventory","teas"];
  for(const k of keys){try{const x=JSON.parse(localStorage.getItem(k));if(Array.isArray(x)&&x.length)return x}catch(e){}}
  return null;
}
let teas=loadExisting()||seed;
teas=teas.map((t,i)=>({
 id:t.id||("tea"+Date.now()+i), name:t.name||"Unnamed Tea",brand:t.brand||"",location:t.location||"",
 amount:t.amount||"Full",gentle:t.gentle||t.gentleRating||"Unknown",preference:t.preference||"Like",
 buyAgain:t.buyAgain||"Maybe",status:t.status||"Normal",type:t.type||"",format:t.format||"",
 backstock:t.backstock||"",notes:t.notes||t.note||"",caffeine:t.caffeine||inferCaf(t),ease:t.ease||inferEase(t)
}));
function inferCaf(t){let s=((t.type||"")+" "+(t.name||"")).toLowerCase();return /herbal|tisane|chamomile|rooibos|decaf|cacao/.test(s)?"Decaf":"Caffeinated"}
function inferEase(t){let s=(t.format||"").toLowerCase();if(/bag|sachet/.test(s))return"Instant";if(/powder|matcha/.test(s))return"A Few Steps";return"Easy"}
let logs=[];for(const k of ["steep_logs","steepLogs","drinkHistory","steep_history"]){try{let x=JSON.parse(localStorage.getItem(k));if(Array.isArray(x)){logs=x;break}}catch(e){}}
function save(){localStorage.setItem("steep_teas",JSON.stringify(teas));localStorage.setItem("steep_logs",JSON.stringify(logs))}
save();

let caffeine="Any", lastPicks={};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function onShelf(){return teas.filter(t=>t.amount!=="Finished")}
function renderHeader(){ $("#count").textContent=onShelf().length+" on shelf"; let f=teas.filter(t=>t.preference==="Favorite").length,u=teas.filter(t=>/use up/i.test(t.status)).length,g=teas.filter(t=>["Gentle","Go-To"].includes(t.gentle)).length;$("#stats").innerHTML=`<span class=chip>${f} favorites</span><span class="chip peach">${u} use-up teas</span><span class=chip>${g} gentle/go-to</span>`}
function eligible(){
 let x=onShelf(), crank=$("#cranky").checked,q=$("#quick").checked;
 if(crank)x=x.filter(t=>["Go-To","Gentle","Maybe"].includes(t.gentle));
 if(q)x=x.filter(t=>["Instant","Easy"].includes(t.ease));
 if(caffeine==="Caffeinated")x=x.filter(t=>t.caffeine==="Caffeinated");
 if(caffeine==="Decaf")x=x.filter(t=>t.caffeine==="Decaf");
 return x;
}
function daysSince(t){let l=logs.filter(x=>x.teaId===t.id).sort((a,b)=>new Date(b.time)-new Date(a.time))[0];return l?Math.floor((Date.now()-new Date(l.time))/86400000):999}
function choose(mode){
 let x=eligible();if(!x.length)return showNone();
 const other=new Set(Object.entries(lastPicks).filter(([m])=>m!==mode).map(([,id])=>id));
 let pool=x.filter(t=>!other.has(t.id));if(!pool.length)pool=x;
 if(mode==="useup"){let u=pool.filter(t=>/use up/i.test(t.status));if(u.length)pool=u}
 if(mode==="different"){pool.sort((a,b)=>daysSince(b)-daysSince(a));pool=pool.slice(0,Math.max(1,Math.ceil(pool.length/3)))}
 if(mode==="best"){pool.sort((a,b)=>score(b)-score(a));pool=pool.slice(0,Math.min(5,pool.length))}
 let t=mode==="wild"?pool[Math.floor(Math.random()*pool.length)]:pool[Math.floor(Math.random()*Math.min(pool.length,mode==="best"?3:pool.length))];
 lastPicks[mode]=t.id; showRec(t,mode)
}
function score(t){let s=0;if(t.preference==="Favorite")s+=5;if(t.gentle==="Go-To"&&$("#cranky").checked)s+=10;if(t.gentle==="Gentle"&&$("#cranky").checked)s+=6;if(t.gentle==="Maybe"&&$("#cranky").checked)s+=1;if(/use up/i.test(t.status))s+=1;s+=Math.min(daysSince(t),30)/10;return s}
function showNone(){$("#recommendation").innerHTML=`<div class=card><div class=note>No teas match all those filters. Try loosening one.</div></div>`}
function showRec(t,mode){let labels={best:"BEST",different:"DIFFERENT",useup:"USE UP",wild:"WILD"};$("#recommendation").innerHTML=`<div class="card rec"><div class=eyebrow>${labels[mode]}</div><h3>${esc(t.name)}</h3><div class=brand>${esc(t.brand)}</div><div class=chips><span class=chip>${esc(t.gentle)}</span><span class=chip>${esc(t.amount)}</span><span class=chip>${esc(t.ease)}</span>${/use up/i.test(t.status)?'<span class="chip peach">Use Up</span>':""}</div>${t.notes?`<div class=note>${esc(t.notes)}</div>`:""}<div class=row><button class="smallbtn dark" onclick="logTea('${t.id}')">☕ I drank this</button><button class=smallbtn onclick="openTea('${t.id}')">View / Edit</button></div></div>`}
function renderShelf(){let q=$("#search").value.toLowerCase(),f=$("#filter").value;let x=teas.filter(t=>(t.name+" "+t.brand).toLowerCase().includes(q));if(f==="Favorites")x=x.filter(t=>t.preference==="Favorite");if(f==="Use Up")x=x.filter(t=>/use up/i.test(t.status));if(f==="Gentle / Go-To")x=x.filter(t=>["Gentle","Go-To"].includes(t.gentle));if(f==="Backstock")x=x.filter(t=>String(t.backstock).trim()&&String(t.backstock).toLowerCase()!=="no");x.sort((a,b)=>a.name.localeCompare(b.name));$("#teaList").innerHTML=x.map(t=>`<div class=tea onclick="openTea('${t.id}')"><h3>${esc(t.name)}</h3><div class=meta>${esc(t.brand)} · ${esc(t.location)} · ${esc(t.amount)}</div><div class=chips><span class=chip>${esc(t.gentle)}</span>${t.preference==="Favorite"?'<span class=chip>★ Favorite</span>':""}${String(t.backstock).trim()&&String(t.backstock).toLowerCase()!=="no"?'<span class=chip>Backstock</span>':""}</div></div>`).join("")}
function openTea(id){let t=teas.find(x=>x.id===id);modal(`<h2>${esc(t.name)}</h2><div class=brand>${esc(t.brand)}</div><div class=chips><span class=chip>${esc(t.type)}</span><span class=chip>${esc(t.gentle)}</span><span class=chip>${esc(t.amount)}</span><span class=chip>${esc(t.ease)}</span></div><div class=note><b>Location:</b> ${esc(t.location)}<br><b>Buy again:</b> ${esc(t.buyAgain)}<br><b>Caffeine:</b> ${esc(t.caffeine)}${t.notes?`<br><br>${esc(t.notes)}`:""}</div><div class=row><button class="smallbtn dark" onclick="logTea('${t.id}')">☕ I drank this</button><button class=smallbtn onclick="editTea('${t.id}')">Edit Tea</button></div>`)}
function modal(body){$("#modal").innerHTML=`<div class=modal onclick="if(event.target===this)closeModal()"><div class=sheet>${body}</div></div>`}
function closeModal(){$("#modal").innerHTML=""}
function logTea(id){let t=teas.find(x=>x.id===id);logs.unshift({id:"log"+Date.now(),teaId:id,name:t.name,time:new Date().toISOString(),note:"",stomach:""});save();modal(`<h2>Logged ✓</h2><div class=note><b>${esc(t.name)}</b> was logged just now.</div><label><b>Optional note</b><textarea id=drinkNote rows=3 placeholder="Loved it, made it iced, stomach felt off later…"></textarea></label><div style="margin:14px 0"><b>How did your stomach do?</b></div><div class=row><button class=smallbtn onclick="finishLog('${logs[0].id}','Fine')">Fine</button><button class=smallbtn onclick="finishLog('${logs[0].id}','Unsure')">Unsure</button><button class="smallbtn peach" onclick="finishLog('${logs[0].id}','Upset')">Upset</button><button class=smallbtn onclick="finishLog('${logs[0].id}','')">Skip</button></div><div style="margin-top:22px"><b>Update stock only if you crossed a rough level:</b></div><div class=row style="margin-top:10px">${["Full","3/4","1/2","1/4","Almost Gone","Finished"].map(a=>`<button class=smallbtn onclick="stock('${id}','${a}')">${a}</button>`).join("")}</div>`)}
function finishLog(id,stomach){let l=logs.find(x=>x.id===id);if(l){l.note=$("#drinkNote")?.value||"";l.stomach=stomach;save()}closeModal();renderLog()}
function stock(id,a){let t=teas.find(x=>x.id===id);t.amount=a;save();renderHeader();renderShelf()}
function editTea(id){let t=teas.find(x=>x.id===id);teaForm(t)}
function teaForm(t={}){let isNew=!t.id;modal(`<h2>${isNew?"Add Tea":"Edit Tea"}</h2><div class=formgrid>
${field("Name","name",t.name,"span2")}${field("Brand","brand",t.brand,"span2")}${field("Location","location",t.location)}${selectF("Amount","amount",t.amount,["Full","3/4","1/2","1/4","Almost Gone","Finished"])}
${selectF("Gentle","gentle",t.gentle,["Go-To","Gentle","Maybe","Avoid","Unknown","No"])}${selectF("Preference","preference",t.preference,["Favorite","Like","Neutral","Not for me"])}
${selectF("Buy Again","buyAgain",t.buyAgain,["Yes","Maybe","No","If available"],"span2")}${field("Status","status",t.status||"Normal","span2")}${field("Type","type",t.type)}${field("Format","format",t.format)}
${selectF("Caffeine","caffeine",t.caffeine||"Caffeinated",["Caffeinated","Decaf"])}${selectF("Ease","ease",t.ease||"Easy",["Instant","Easy","A Few Steps","Ritual"])}
${field("Backstock","backstock",t.backstock,"span2")}<label class=span2>Notes / pairings / lore<textarea id=f_notes rows=4>${esc(t.notes||"")}</textarea></label></div><button class="smallbtn dark" style="margin-top:20px" onclick="saveTea('${t.id||""}')">Save Changes</button>`)}
function field(label,id,val,cl=""){return `<label class="${cl}">${label}<input type=text id=f_${id} value="${esc(val||"")}"></label>`}
function selectF(label,id,val,opts,cl=""){return `<label class="${cl}">${label}<select id=f_${id}>${opts.map(o=>`<option ${o==val?"selected":""}>${o}</option>`).join("")}</select></label>`}
function saveTea(id){let t=id?teas.find(x=>x.id===id):{id:"tea"+Date.now()};["name","brand","location","amount","gentle","preference","buyAgain","status","type","format","caffeine","ease","backstock","notes"].forEach(k=>t[k]=$("#f_"+k).value);if(!id)teas.push(t);save();closeModal();renderHeader();renderShelf()}
function renderLog(){let q=$("#logSearch").value.toLowerCase(),range=$("#logRange").value;let x=logs.filter(l=>(l.name||teas.find(t=>t.id===l.teaId)?.name||"").toLowerCase().includes(q));if(range!=="all"){let cut=Date.now()-Number(range)*86400000;x=x.filter(l=>new Date(l.time).getTime()>=cut)};let counts={};x.forEach(l=>{let n=l.name||teas.find(t=>t.id===l.teaId)?.name||"Unknown";counts[n]=(counts[n]||0)+1});let top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];$("#logStats").innerHTML=`<span class=chip>${x.length} cups logged</span>${top?`<span class=chip>Most: ${esc(top[0])} (${top[1]})</span>`:""}`;$("#logList").innerHTML=x.length?x.map(l=>{let n=l.name||teas.find(t=>t.id===l.teaId)?.name||"Unknown";return `<div class=logitem><h3>${esc(n)}</h3><div class=logmeta>${new Date(l.time).toLocaleString()}</div>${l.stomach?`<span class=chip>Stomach: ${esc(l.stomach)}</span>`:""}${l.note?`<div class=note>${esc(l.note)}</div>`:""}</div>`}).join(""):`<div class=note>No logged cups yet. Your extremely satisfying tea data begins with the next cup. ☕</div>`}
$$("[data-mode]").forEach(b=>b.onclick=()=>choose(b.dataset.mode));
$("#cafSeg").onclick=e=>{if(!e.target.dataset.caf)return;caffeine=e.target.dataset.caf;$$(".seg").forEach(x=>x.classList.toggle("active",x===e.target))}
$$(".nav button").forEach(b=>b.onclick=()=>{$$("section").forEach(s=>s.classList.add("hidden"));$("#"+b.dataset.page).classList.remove("hidden");$$(".nav button").forEach(x=>x.classList.toggle("active",x===b));if(b.dataset.page==="shelf")renderShelf();if(b.dataset.page==="log")renderLog()});
$("#search").oninput=renderShelf;$("#filter").onchange=renderShelf;$("#logSearch").oninput=renderLog;$("#logRange").onchange=renderLog;$("#addTea").onclick=()=>teaForm();
renderHeader();renderShelf();renderLog();
</script>
</body></html>
