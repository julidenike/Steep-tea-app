atus": "Finish Soon", "notes": "2-3 servings", "id": "adagio-white-blueberry", "lastDrink": ""}],KEY='steep-v2-teas';let teas=JSON.parse(localStorage.getItem(KEY)||'null')||SEED;
const E=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const chip=(s,c='')=>s?`<span class="chip ${c}">${E(s)}</span>`:'';

function score(t,m,c){let s=Math.random();if(t.preference==='Favorite')s+=3;if(t.preference==='Like')s+=1.2;if(m==='useup')s+=t.status==='Use Up'?10:-10;if(m==='different'){if(!t.lastDrink)s+=2.5;if(/Forgotten/.test(t.status))s+=5}if(m==='wild')s=Math.random()*10;if(c)s+=({Go-To:10,Gentle:7,Maybe:2,Unknown:-10,Avoid:-30}[t.gentle]??-10);if(/Conserve/.test(t.status))s-=3;return s}
function recTea(m){let c=cranky.checked,p=teas.filter(t=>t.amount!=='Finished'&&t.status!=='Primarily Charles');if(m==='useup')p=p.filter(t=>t.status==='Use Up');if(c)p=p.filter(t=>!['Avoid','Unknown'].includes(t.gentle));if(!p.length)return;let t=[...p].sort((a,b)=>score(b,m,c)-score(a,m,c))[0];rec.innerHTML=`<div class="muted">${m.toUpperCase()}</div><div class="hero">${E(t.name)}</div><div>${E(t.brand)}</div><div class="chips">${chip(t.gentle)}${chip(t.amount)}${t.status!=='Normal'?chip(t.status,'warn'):''}</div><p>${E(t.notes)}</p><div class="actions"><button class="primary" onclick="drink('${t.id}')">☕ I drank this</button><button onclick="openTea('${t.id}')">View / Edit</button></div>`;rec.classList.remove('hidden')}

function form(t={}){let o=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');return `<div class="field"><label>Name</label><input id="fn" value="${E(t.name)}"></div><div class="field"><label>Brand</label><input id="fb" value="${E(t.brand)}"></div><div class="grid"><div class="field"><label>Location</label><input id="fl" value="${E(t.location||'Tea Drawer')}"></div><div class="field"><label>Amount</label><select id="fa">${o(['Full','3/4','1/2','1/4','Almost Gone','Low','Finished'],t.amount||'Full')}</select></div></div><div class="grid"><div class="field"><label>Gentle</label><select id="fg">${o(['Go-To','Gentle','Maybe','Avoid','Unknown'],t.gentle||'Unknown')}</select></div><div class="field"><label>Preference</label><select id="fp">${o(['Favorite','Like','Neutral','Not for me','Unknown'],t.preference||'Unknown')}</select></div></div><div class="field"><label>Buy Again</label><select id="fy">${o(['Yes','Maybe','No','Unknown','Yes if available'],t.buyAgain||'Unknown')}</select></div><div class="field"><label>Status</label><input id="fs" value="${E(t.status||'Normal')}"></div><div class="field"><label>Type</label><input id="ft" value="${E(t.type)}"></div><div class="field"><label>Format</label><input id="ff" value="${E(t.format)}"></div><div class="field"><label>Backstock</label><input id="fk" value="${E(t.backstock)}"></div><div class="field"><label>Notes / pairings / lore</label><textarea id="fno" rows="4">${E(t.notes)}</textarea></div>`}

function editTea(id){let t=teas.find(x=>x.id===id);mt.textContent='Edit Tea';mb.innerHTML=form(t)+`<button class="primary" onclick="saveForm('${id}')">Save Changes</button>`}
function saveForm(id=''){let t=id?teas.find(x=>x.id===id):{};t.name=fn.value.trim();t.brand=fb.value.trim();if(!t.name||!t.brand)return alert('Name and brand are required.');Object.assign(t,{location:fl.value,amount:fa.value,gentle:fg.value,preference:fp.value,buyAgain:fy.value,status:fs.value,type:ft.value,format:ff.value,backstock:fk.value,notes:fno.value});if(!id){t.id='custom-'+Date.now();t.lastDrink='';teas.push(t)}save();closeM();page('shelf')}
function closeM(){modal.classList.add('hidden')}
function renderShelf(){let s=(q.value||'').toLowerCase(),f=flt.value,a=teas.filter(t=>JSON.stringify(t).toLowerCase().includes(s));if(f==='Favorites')a=a.filter(t=>t.preference==='Favorite');if(f==='Use Up')a=a.filter(t=>t.status==='Use Up');if(f==='Gentle')a=a.filter(t=>['Go-To','Gentle','Maybe'].includes(t.gentle));if(f==='Low')a=a.filter(t=>['1/4','Almost Gone','Low','Finished'].includes(t.amount));a.sort((x,y)=>x.name.localeCompare(y.name));list.innerHTML=a.map(t=>`<div class="tea" onclick="openTea('${t.id}')"><div class="teaTitle">${E(t.name)}</div><div class="muted">${E(t.brand)} · ${E(t.location)} · ${E(t.amount)}</div><div class="chips">${chip(t.gentle)}${t.preference==='Favorite'?chip('★ Favorite'):''}${t.status!=='Normal'?chip(t.status,'warn'):''}${t.backstock?chip('Backstock'):''}</div></div>`).join('')}
function render(){count.textContent=teas.filter(t=>t.amount!=='Finished').length+' on shelf';let u=teas.filter(t=>t.status==='Use Up'&&t.amount!=='Finished').length,f=teas.filter(t=>t.preference==='Favorite'&&t.amount!=='Finished').length,g=teas.filter(t=>['Go-To','Gentle'].includes(t.gentle)&&t.amount!=='Finished').length;stats.innerHTML=`<div class="chips">${chip(f+' favorites')}${chip(u+' use-up teas','warn')}${chip(g+' gentle/go-to')}</div><p class="muted">Maybe is conditional. Unknown stays separate.</p>`;renderShelf()}render();</script></body></html>
