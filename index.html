<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Steep v4</title>
<style>
:root{--bg:#f7f0e5;--card:#fffaf1;--brown:#73523f;--text:#443830;--muted:#8e8177;--sage:#dfe8d8;--peach:#f3d0bf;--line:#ded3c4}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;padding:42px 28px 118px}.header{display:flex;justify-content:space-between;align-items:flex-start}.logo{font:700 76px Georgia,serif;color:var(--brown);line-height:.9}.tag{font:italic 28px Georgia,serif;color:#8d7667;margin-top:12px}.count{background:var(--sage);padding:12px 20px;border-radius:28px;font-size:20px}
.card{background:var(--card);border:2px solid var(--line);border-radius:38px;padding:30px;margin-top:30px}.card h2,.shelf-title{font:700 42px Georgia,serif;color:var(--brown);margin:0 0 22px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toggleline{grid-column:1/-1;display:flex;gap:12px;align-items:center;font-weight:650;font-size:20px}.toggleline input{width:34px;height:34px}
.segment{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 5px}.seg{border:0;border-radius:24px;background:var(--sage);padding:11px 15px;font-size:16px;color:var(--brown);font-weight:650}.seg.active{background:var(--brown);color:white}
button{font:inherit}.action{border:0;border-radius:24px;padding:20px 10px;font-size:18px;font-weight:700;color:var(--brown);background:var(--sage)}.action.primary{background:var(--brown);color:white}.action.peach{background:var(--peach)}
.rec h3,.tea h3{font:700 40px Georgia,serif;color:var(--brown);margin:8px 0}.eyebrow{color:var(--muted);font-size:18px}.brand{font-size:25px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.chip{background:var(--sage);padding:9px 14px;border-radius:22px}.chip.peach{background:var(--peach)}.note{font-size:20px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.smallbtn{border:0;border-radius:22px;padding:15px 18px;font-weight:700;background:var(--sage);color:var(--brown)}.smallbtn.dark{background:var(--brown);color:white}
.searchrow{display:grid;grid-template-columns:2fr 1fr;gap:10px}.field,select,textarea,input[type=text]{width:100%;font-size:20px;padding:15px;border:2px solid var(--line);border-radius:20px;background:white}.tea{padding:18px 0;border-bottom:2px solid var(--line)}.tea h3{font-size:29px;margin:0}.meta{color:var(--muted);font-size:18px}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,250,241,.96);border-top:2px solid var(--line);display:flex;justify-content:center;padding:14px max(18px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom));gap:8px}.nav button{width:min(31%,230px);border:0;border-radius:24px;padding:17px 5px;background:transparent;color:var(--brown);font-weight:700}.nav button.active{background:var(--sage)}
.hidden{display:none!important}.modal{position:fixed;inset:0;background:#665d5688;z-index:5;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--bg);width:min(760px,100%);max-height:91vh;overflow:auto;border-radius:38px 38px 0 0;padding:30px 28px calc(34px + env(safe-area-inset-bottom))}.sheet h2{font:700 38px Georgia,serif;color:var(--brown);margin:0 0 18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid label{font-weight:700;color:var(--brown)}.span2{grid-column:1/-1}.logitem{padding:18px 0;border-bottom:2px solid var(--line)}.logitem h3{font:700 26px Georgia,serif;color:var(--brown);margin:0 0 5px}.logmeta{color:var(--muted)}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
@media(max-width:500px){.app{padding:38px 16px 112px}.logo{font-size:58px}.tag{font-size:22px}.card{padding:22px 18px;border-radius:30px}.card h2,.shelf-title{font-size:34px}.action{font-size:16px}.rec h3{font-size:34px}.formgrid{grid-template-columns:1fr}.span2{grid-column:1}}

/* v4 compact iPhone pass */
.app{padding:26px 18px 104px}.logo{font-size:58px}.tag{font-size:21px}.count{font-size:15px;padding:9px 13px}
.card{padding:20px;margin-top:18px;border-radius:28px}.card h2,.shelf-title{font-size:32px;margin-bottom:15px}
.toggleline{font-size:17px}.toggleline input{width:27px;height:27px}.action{padding:15px 8px;font-size:15px}
.rec h3{font-size:32px}.brand{font-size:19px}.eyebrow,.meta{font-size:15px}.note{font-size:17px}
.chip{padding:7px 11px;font-size:14px}.smallbtn{padding:12px 15px}.field,select,textarea,input[type=text]{font-size:17px;padding:12px}
.tea{padding:14px 0}.tea h3{font-size:25px}.nav{padding-top:9px}.nav button{padding:13px 4px}
.sheet{padding:22px 18px calc(28px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0}.sheet h2{font-size:31px}
.closex{float:right;border:0;background:var(--sage);color:var(--brown);width:42px;height:42px;border-radius:50%;font-size:24px;font-weight:700}
body.keyboard .nav{display:none}
.logitem{cursor:pointer}
@media(max-width:500px){.app{padding:24px 14px 100px}.logo{font-size:50px}.tag{font-size:19px}.card{padding:18px 15px}.card h2,.shelf-title{font-size:29px}.rec h3{font-size:30px}}

</style>
</head>
<body>
<div class="app">
<header class="header"><div><div class="logo">Steep</div><div class="tag">all I need is tea and a book</div></div><div class="count" id="count"></div></header>

<section id="home">
<div class="card"><h2>What should I drink?</h2><div class="controls">
<label class="toggleline"><input type="checkbox" id="cranky"> My stomach is cranky</label>
<label class="toggleline"><input type="checkbox" id="quick"> ⚡ Quick & easy</label>
<div class="segment" id="cafSeg"><button class="seg active" data-caf="Any">Any caffeine</button><button class="seg" data-caf="Caffeinated">Need caffeine</button><button class="seg" data-caf="Decaf">Decaf / herbal</button></div>
<button class="action primary" data-mode="best">Best Pick</button><button class="action" data-mode="different">Something Different</button>
<button class="action peach" data-mode="useup">Use Something Up</button><button class="action" data-mode="wild">Wildcard</button>
</div></div>
<div id="recommendation"></div>
<div class="card" id="collection"><h2>Collection</h2><div class="stats" id="stats"></div><div style="color:var(--muted)">Maybe is conditional. Unknown stays separate.</div></div>
</section>

<section id="shelf" class="hidden">
<div class="card"><div style="display:flex;justify-content:space-between;gap:15px"><div><h2 class="shelf-title">Tea Shelf</h2><div style="color:var(--muted);font-size:19px">Tap any tea to log, edit, or update stock.</div></div><button class="smallbtn dark" id="addTea">+ Add Tea</button></div>
<div class="searchrow" style="margin-top:22px"><input class="field" id="search" placeholder="Search…"><select id="filter"><option>All</option><option>Favorites</option><option>Use Up</option><option>Gentle / Go-To</option><option>Backstock</option></select></div>
<div id="teaList"></div></div>
</section>

<section id="log" class="hidden">
<div class="card"><h2>Tea Log</h2><div style="color:var(--muted);font-size:19px;margin-bottom:18px">Because sometimes the tea was memorable and sometimes your brain said ✨ goodbye ✨.</div>
<div class="searchrow"><input class="field" id="logSearch" placeholder="Filter by tea…"><select id="logRange"><option value="all">All time</option><option value="30">Last 30 days</option><option value="7">Last 7 days</option></select></div>
<div class="stats" id="logStats"></div><div id="logList"></div></div>
</section>
</div>

<nav class="nav"><button class="active" data-page="home">⌂ Home</button><button data-page="shelf">☕ Tea Shelf</button><button data-page="log">☷ Tea Log</button></nav>

const V4KEY="steep-v4-teas", LOGKEY="steep_logs", MIGRATIONKEY="steep-v4-migrated-1";

function norm(s){return String(s||"").trim().toLowerCase().replace(/\s+/g," ")}
function readArray(k){try{const x=JSON.parse(localStorage.getItem(k));return Array.isArray(x)?x:null}catch(e){return null}}
function inferCaf(t){let s=((t.type||"")+" "+(t.name||"")).toLowerCase();return /herbal|tisane|chamomile|rooibos|decaf/.test(s)?"Decaf":"Caffeinated"}
function inferEase(t){let s=(t.format||"").toLowerCase();if(/bag|sachet|packet/.test(s))return"Instant";if(/powder|matcha/.test(s))return"A Few Steps";return"Easy"}

const FORCE={
 "wild sweet orange":{location:"Tea Drawer",backstock:"Backstock in Back Pantry"},

function migrate(){
 const already=readArray(V4KEY);
 if(already && already.length) return already;

 // v3 is the newest editable inventory; v2 is also checked so this migration can
 // recover from either upgrade path. Generic Cacao is intentionally discarded.
 const v3=readArray("steep_teas")||[];
 const v2=readArray("steep-v2-teas")||[];
 const sources=[...v2,...v3].filter(t=>norm(t.name)!=="cacao");
 const byName=new Map();
 for(const s of sources){
   const n=norm(s.name);
   if(n==="sweet strawberry matcha" && byName.has(n)){
     byName.set(n,{...byName.get(n),...s}); // collapse the accidental v3 duplicate
   } else byName.set(n,s);
 }
 let out=MASTER.map(base=>{
   const live=byName.get(norm(base.name));
   let t=live?{...base,...live,id:base.id}:{...base};
   // Preserve stable master identity and apply only physically audited corrections.
   t.id=base.id;
   if(FORCE[norm(t.name)]) t={...t,...FORCE[norm(t.name)]};
   t.caffeine=t.caffeine||inferCaf(t);
   t.ease=t.ease||inferEase(t);
   t.lastDrink=t.lastDrink||base.lastDrink||"";
   return t;
 });
 localStorage.setItem(V4KEY,JSON.stringify(out));
 localStorage.setItem(MIGRATIONKEY,new Date().toISOString());
 return out;
}
let teas=migrate();

let logs=[];
for(const k of ["steep_logs","steepLogs","drinkHistory","steep_history"]){
 const x=readArray(k); if(x){logs=x;break}
}
// Re-link logs to v4 stable IDs by logged name when possible.
logs=logs.map(l=>{
 const t=teas.find(t=>norm(t.name)===norm(l.name))||teas.find(t=>t.id===l.teaId);
 return t?{...l,teaId:t.id,name:t.name}:l;
});
function save(){localStorage.setItem(V4KEY,JSON.stringify(teas));localStorage.setItem(LOGKEY,JSON.stringify(logs))}

let caffeine="Any", lastPicks={}, pendingLog=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function onShelf(){return teas.filter(t=>t.amount!=="Finished")}
function renderHeader(){ $("#count").textContent=onShelf().length+" on shelf"; let f=onShelf().filter(t=>t.preference==="Favorite").length,u=onShelf().filter(t=>/use up/i.test(t.status)).length,g=onShelf().filter(t=>["Gentle","Go-To"].includes(t.gentle)).length;$("#stats").innerHTML=`<span class=chip>${f} favorites</span><span class="chip peach">${u} use-up teas</span><span class=chip>${g} gentle/go-to</span>`}
function eligible(){
 let x=onShelf(), crank=$("#cranky").checked,q=$("#quick").checked;
 if(crank)x=x.filter(t=>["Go-To","Gentle","Maybe"].includes(t.gentle));
 if(q)x=x.filter(t=>["Instant","Easy"].includes(t.ease));
 if(caffeine==="Caffeinated")x=x.filter(t=>t.caffeine==="Caffeinated");
 if(caffeine==="Decaf")x=x.filter(t=>t.caffeine==="Decaf");
 return x;
}
function lastLog(t){return logs.filter(x=>x.teaId===t.id||norm(x.name)===norm(t.name)).sort((a,b)=>new Date(b.time)-new Date(a.time))[0]}
function daysSince(t){let l=lastLog(t);return l?Math.floor((Date.now()-new Date(l.time))/86400000):999}
function choose(mode){
 let x=eligible();if(!x.length)return showNone();
 const shown=new Set(Object.values(lastPicks));
 let pool=x.filter(t=>!shown.has(t.id));if(!pool.length)pool=x;
 if(mode==="useup"){let u=pool.filter(t=>/use up/i.test(t.status));if(!u.length)return $("#recommendation").innerHTML=`<div class=card><div class=note>No Use Up teas match those filters.</div></div>`;pool=u}
 if(mode==="different"){let best=lastPicks.best;pool=pool.filter(t=>t.id!==best);pool.sort((a,b)=>daysSince(b)-daysSince(a));pool=pool.slice(0,Math.max(1,Math.ceil(pool.length/3)))}
 if(mode==="best"){pool.sort((a,b)=>score(b)-score(a));pool=pool.slice(0,Math.min(4,pool.length))}
 let t=mode==="wild"?pool[Math.floor(Math.random()*pool.length)]:pool[Math.floor(Math.random()*Math.min(pool.length,mode==="best"?2:pool.length))];
 lastPicks[mode]=t.id; showRec(t,mode)
}
function score(t){let s=0;if(t.preference==="Favorite")s+=6;if($("#cranky").checked){if(t.gentle==="Go-To")s+=14;if(t.gentle==="Gentle")s+=9;if(t.gentle==="Maybe")s+=2}if(/finish soon|forgotten/i.test(t.status))s+=2;s+=Math.min(daysSince(t),45)/10;return s}
function showNone(){$("#recommendation").innerHTML=`<div class=card><div class=note>No teas match all those filters. Try loosening one.</div></div>`}
function showRec(t,mode){let labels={best:"BEST PICK",different:"SOMETHING DIFFERENT",useup:"USE SOMETHING UP",wild:"WILDCARD"};$("#recommendation").innerHTML=`<div class="card rec"><div class=eyebrow>${labels[mode]}</div><h3>${esc(t.name)}</h3><div class=brand>${esc(t.brand)}</div><div class=chips><span class=chip>${esc(t.gentle)}</span><span class=chip>${esc(t.amount)}</span><span class=chip>${esc(t.ease)}</span>${/use up/i.test(t.status)?'<span class="chip peach">Use Up</span>':""}</div>${t.notes?`<div class=note>${esc(t.notes)}</div>`:""}<div class=row><button class="smallbtn dark" onclick="logTea('${t.id}')">☕ I drank this</button><button class=smallbtn onclick="openTea('${t.id}')">View / Edit</button></div></div>`}
function renderShelf(){let q=$("#search").value.toLowerCase(),f=$("#filter").value;let x=teas.filter(t=>(t.name+" "+t.brand).toLowerCase().includes(q));if(f==="Favorites")x=x.filter(t=>t.preference==="Favorite");if(f==="Use Up")x=x.filter(t=>/use up/i.test(t.status));if(f==="Gentle / Go-To")x=x.filter(t=>["Gentle","Go-To"].includes(t.gentle));if(f==="Backstock")x=x.filter(t=>String(t.backstock).trim()&&String(t.backstock).toLowerCase()!=="no");x.sort((a,b)=>a.name.localeCompare(b.name));$("#teaList").innerHTML=x.map(t=>`<div class=tea onclick="openTea('${t.id}')"><h3>${esc(t.name)}</h3><div class=meta>${esc(t.brand)} · ${esc(t.location)} · ${esc(t.amount)}</div><div class=chips><span class=chip>${esc(t.gentle)}</span>${t.preference==="Favorite"?'<span class=chip>★ Favorite</span>':""}${String(t.backstock).trim()&&String(t.backstock).toLowerCase()!=="no"?'<span class=chip>Backstock</span>':""}</div></div>`).join("")}
function openTea(id){let t=teas.find(x=>x.id===id);if(!t)return;modal(`<button class=closex onclick="closeModal()" aria-label="Close">×</button><h2>${esc(t.name)}</h2><div class=brand>${esc(t.brand)}</div><div class=chips><span class=chip>${esc(t.type)}</span><span class=chip>${esc(t.gentle)}</span><span class=chip>${esc(t.amount)}</span><span class=chip>${esc(t.ease)}</span></div><div class=note><b>Location:</b> ${esc(t.location)}<br><b>Backstock:</b> ${esc(t.backstock||"None")}<br><b>Buy again:</b> ${esc(t.buyAgain)}<br><b>Caffeine:</b> ${esc(t.caffeine)}${t.notes?`<br><br>${esc(t.notes)}`:""}</div><div class=row><button class="smallbtn dark" onclick="logTea('${t.id}')">☕ I drank this</button><button class=smallbtn onclick="editTea('${t.id}')">Edit Tea</button></div>`)}

 modal(`<button class=closex onclick="closeModal()" aria-label="Close">×</button><h2>Log ${esc(t.name)}</h2>
 <div class=note><b>1. Stock after this cup</b></div>
 <div class=row>${["No change","Full","3/4","1/2","1/4","Almost Gone","Finished"].map(a=>`<button class="smallbtn ${a==="No change"?"dark":""}" data-stock="${a}" onclick="pickStock(this,'${a}')">${a}</button>`).join("")}</div>
 <div class=note style="margin-top:20px"><b>2. Optional reaction</b></div>
 <div class=row>${["Fine","Unsure","Upset","Skip"].map(a=>`<button class=smallbtn data-stomach="${a}" onclick="pickStomach(this,'${a==="Skip"?"":a}')">${a}</button>`).join("")}</div>
 <label style="display:block;margin-top:18px"><b>Optional note</b><textarea id=drinkNote rows=3 placeholder="Iced, loved it, stomach felt fine…"></textarea></label>
 <button class="smallbtn dark" style="margin-top:18px;width:100%" onclick="finishLog()">Save cup</button>`)
}
function pickStock(el,a){pendingLog.amount=a;el.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("dark"));el.classList.add("dark")}
function pickStomach(el,a){pendingLog.stomach=a;el.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("dark"));el.classList.add("dark")}
function finishLog(){
 if(!pendingLog)return;
 let t=teas.find(x=>x.id===pendingLog.teaId);
 if(pendingLog.amount && pendingLog.amount!=="No change")t.amount=pendingLog.amount;
 pendingLog.note=$("#drinkNote")?.value||"";
 logs.unshift({id:"log"+Date.now(),teaId:t.id,name:t.name,time:pendingLog.time,note:pendingLog.note,stomach:pendingLog.stomach});
 t.lastDrink=pendingLog.time.slice(0,10);
 save();pendingLog=null;closeModal();renderHeader();renderShelf();renderLog()
}

function editTea(id){let t=teas.find(x=>x.id===id);teaForm(t)}
function teaForm(t={}){let isNew=!t.id;modal(`<button class=closex onclick="closeModal()" aria-label="Close">×</button><h2>${isNew?"Add Tea":"Edit Tea"}</h2><div class=formgrid>
${field("Name","name",t.name,"span2")}${field("Brand","brand",t.brand,"span2")}${field("Location","location",t.location)}${selectF("Amount","amount",t.amount,["Full","3/4","1/2","1/4","Almost Gone","Finished"])}
${selectF("Gentle","gentle",t.gentle,["Go-To","Gentle","Maybe","Avoid","Unknown"])}${selectF("Preference","preference",t.preference,["Favorite","Like","Neutral","Not for me","Unknown"])}
${selectF("Buy Again","buyAgain",t.buyAgain,["Yes","Maybe","No","If available","Unknown"],"span2")}${field("Status","status",t.status||"Normal","span2")}${field("Type","type",t.type)}${field("Format","format",t.format)}
${selectF("Caffeine","caffeine",t.caffeine||"Caffeinated",["Caffeinated","Decaf"])}${selectF("Ease","ease",t.ease||"Easy",["Instant","Easy","A Few Steps","Ritual"])}
${field("Backstock","backstock",t.backstock,"span2")}<label class=span2>Notes / pairings / lore<textarea id=f_notes rows=4>${esc(t.notes||"")}</textarea></label></div><button class="smallbtn dark" style="margin-top:20px" onclick="saveTea('${t.id||""}')">Save Changes</button>`)}
function field(label,id,val,cl=""){return `<label class="${cl}">${label}<input type=text id=f_${id} value="${esc(val||"")}"></label>`}
function selectF(label,id,val,opts,cl=""){return `<label class="${cl}">${label}<select id=f_${id}>${opts.map(o=>`<option ${o==val?"selected":""}>${o}</option>`).join("")}</select></label>`}
function saveTea(id){let t=id?teas.find(x=>x.id===id):{id:"tea"+Date.now(),lastDrink:""};["name","brand","location","amount","gentle","preference","buyAgain","status","type","format","caffeine","ease","backstock","notes"].forEach(k=>t[k]=$("#f_"+k).value);if(!id)teas.push(t);save();closeModal();renderHeader();renderShelf()}

function renderLog(){
 let q=$("#logSearch").value.toLowerCase(),range=$("#logRange").value;
 let x=logs.filter(l=>(l.name||teas.find(t=>t.id===l.teaId)?.name||"").toLowerCase().includes(q));
 if(range!=="all"){let cut=Date.now()-Number(range)*86400000;x=x.filter(l=>new Date(l.time).getTime()>=cut)}
 x.sort((a,b)=>new Date(b.time)-new Date(a.time));
 let counts={};x.forEach(l=>{let n=l.name||teas.find(t=>t.id===l.teaId)?.name||"Unknown";counts[n]=(counts[n]||0)+1});
 let top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
 $("#logStats").innerHTML=`<span class=chip>${x.length} cups logged</span>${top?`<span class=chip>Most: ${esc(top[0])} (${top[1]})</span>`:""}`;
 $("#logList").innerHTML=x.length?x.map(l=>{let t=teas.find(t=>t.id===l.teaId)||teas.find(t=>norm(t.name)===norm(l.name));let n=l.name||t?.name||"Unknown";return `<div class=logitem ${t?`onclick="openTea('${t.id}')"`:""}><h3>${esc(n)}</h3><div class=logmeta>${new Date(l.time).toLocaleString()}</div>${l.stomach?`<span class=chip>Stomach: ${esc(l.stomach)}</span>`:""}${l.note?`<div class=note>${esc(l.note)}</div>`:""}</div>`}).join(""):`<div class=note>No logged cups yet. Your extremely satisfying tea data begins with the next cup. ☕</div>`
}

$$("[data-mode]").forEach(b=>b.onclick=()=>choose(b.dataset.mode));
$("#cafSeg").onclick=e=>{if(!e.target.dataset.caf)return;caffeine=e.target.dataset.caf;$$(".seg").forEach(x=>x.classList.toggle("active",x===e.target))}
$$(".nav button").forEach(b=>b.onclick=()=>{$$("section").forEach(s=>s.classList.add("hidden"));$("#"+b.dataset.page).classList.remove("hidden");$$(".nav button").forEach(x=>x.classList.toggle("active",x===b));if(b.dataset.page==="shelf")renderShelf();if(b.dataset.page==="log")renderLog()});
$("#search").oninput=renderShelf;$("#filter").onchange=renderShelf;$("#logSearch").oninput=renderLog;$("#logRange").onchange=renderLog;$("#addTea").onclick=()=>teaForm();

// iOS keyboard: hide bottom nav while a text/search field has focus.
document.addEventListener("focusin",e=>{if(e.target.matches("input,textarea"))document.body.classList.add("keyboard")});
document.addEventListener("focusout",()=>setTimeout(()=>document.body.classList.remove("keyboard"),120));

save();renderHeader();renderShelf();renderLog();

</script>
</body></html>
