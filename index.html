<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#829174"><title>Steep</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fbf5e9;color:#40372f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:26px 18px;background:linear-gradient(135deg,#dce4d5,#f2d9cb)}h1,h2,h3{font-family:Georgia,serif;color:#5b4436}h1{font-size:40px;margin:0}.tag{font-family:Georgia,serif;font-style:italic;margin:4px 0}.wrap{max-width:720px;margin:auto;padding:15px 15px 85px}.card{background:#fffdf8;border:1px solid #e2d8c8;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 3px 12px #5b443610}h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .wide{grid-column:1/-1}button{border:0;border-radius:13px;padding:12px;background:#829174;color:white;font-weight:700;font-size:15px}.alt{background:#eee6da;color:#5b4436}.peach{background:#e8b29a;color:#432f27}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:8px 10px;border:1px solid #d8cbbb;background:white;color:#5b4436;border-radius:999px}.chip.on{background:#829174;color:white}.tea{padding:13px 0;border-top:1px solid #eee4d8}.tea:first-child{border:0}.tea h3{margin:0 0 4px}.meta,.small{color:#80766e;font-size:13px;line-height:1.4}.badge{display:inline-block;padding:4px 7px;background:#eee7dc;border-radius:999px;font-size:12px;margin:5px 3px 3px 0}.green{background:#dbe8d4}.use{background:#f3c9ba}.qty button{padding:6px 8px;margin:6px 3px 0 0;background:#eee7dc;color:#5b4436;font-size:12px}input{width:100%;padding:12px;border:1px solid #d7ccbd;border-radius:12px;font-size:16px}section{display:none}section.on{display:block}nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf8ee;border-top:1px solid #ddd2c3;padding:8px;text-align:center}nav button{background:transparent;color:#5b4436}nav button.on{background:#dce4d5}.pick{border-left:5px solid #e8b29a}.hide{display:none}</style></head>
<body><header><h1>Steep</h1><div class="tag">all I need is tea and a book</div></header><div class="wrap">
<section id="home" class="on"><div class="card"><h2>What should I drink?</h2><div class="grid"><button class="wide" onclick="pick('best')">🫖 Best pick</button><button class="alt" onclick="pick('different')">✨ Something different</button><button class="peach" onclick="pick('wild')">🎲 Wildcard</button></div><p><button id="cranky" class="alt" onclick="crank()">🌿 My stomach is cranky</button></p><div id="result"></div></div>
<div class="card"><h2>What am I in the mood for?</h2><div class="chips" id="moods"></div><p><button onclick="pick('mood')">Find my tea</button></p></div><div class="card"><h2>Needs attention</h2><div id="attention"></div></div></section>
<section id="shelf"><div class="card"><h2>My tea shelf</h2><input id="search" placeholder="Search tea, type, location…" oninput="shelf()"><div id="list"></div></div></section></div>
<nav><button class="on" onclick="tab('home',this)">☕ Home</button><button onclick="tab('shelf',this)">📚 Tea Shelf</button></nav>
<script>
const D=[
["Tazo Wild Sweet Orange","Herbal","Tea bag","Hall Pantry","Unknown","Gentle","Like","Maybe","Fruity,Uplifting","Year-round","Instant","Caffeine-free."],
["Twinings Wild Berries","Herbal","Tea bag","Tea Drawer","½","Gentle","Like","Maybe","Fruity,Sweet","Year-round","Instant","1 backup box in Hall Pantry.","1 backup"],
["Yogi Mango Ginger","Herbal","Tea bag","Hall Pantry","Unknown","Go-To","Favorite","Yes","Fruity,Spicy","Year-round","Instant","Go-to when stomach feels bad. Caffeine-free."],
["Eternal Spring + Blood Orange","White + Herbal","Loose leaf","Tea Cabinet","¼","Unknown","Favorite","Yes","Fruity,Uplifting","Year-round","Easy","Adagio custom blend; regular heavy hitter.","Bulk backup"],
["Harney & Sons Vanilla","Black","Sachet","Tea Drawer","½","Unknown","Favorite","Yes","Cozy,Sweet,Classic","Year-round","Instant","Daily go-to. Great with Black Cask Bourbon or Berry Creme Compote.","Bulk backup"],
["Adagio Hazelberry Pu-erh","Pu-erh","Loose leaf","Tea Drawer","¼","Maybe","Favorite","Yes","Cozy,Sweet","Year-round","Easy","Daily go-to."],
["Adagio Bella Luna","Black","Loose leaf","Tea Drawer","Full","Avoid","Favorite","Yes","Cozy,Classic","Year-round","Easy","Coconut + cream Earl Grey style. Order only on the full moon."],
["Paromi Bourbon Vanilla","Black","Sachet","Tea Cabinet","Full","Avoid","Favorite","Yes","Cozy,Sweet","Cool weather","Instant","Hard to find; usually at The Fresh Market. Restock early."],
["Alice in Wonderland Tea Time Blend","Blend","Sachet","Tea Cabinet","¾","Avoid","Like","Maybe","Fun,Classic","Year-round","Instant","Gift from neighbor; sentimental."],
["Harney Green Hot Cinnamon Spice","Green","Loose leaf","Tea Cabinet","¼","Maybe","Neutral","No","Cozy,Spicy","Cool weather","Easy","USEUP: Prefer the black Hot Cinnamon Spice."],
["Traditional Masala Chai","Black / Chai","Loose leaf","Tea Cabinet","½","Avoid","Favorite","Yes","Cozy,Spicy","Cool weather","Easy","Usually buy a simple 3 oz bag."],
["The Hemp Division Chill","Herbal","Sachet","Tea Cabinet","Full","Gentle","Like","No","Uplifting","Year-round","Instant","USEUP: CBD herbal tea. Minty; finish remaining supply."],
["Harney Black Cask Bourbon","Black","Loose leaf","Tea Drawer","¾","Avoid","Neutral","No","Cozy","Cool weather","Easy","USEUP: High priority. Bitter alone; blend with Harney Vanilla."],
["Adagio Matcha Chocolate","Matcha","Powder","Tea Drawer","Full","Avoid","Like","Maybe","Cozy,Sweet","Winter","Ritual","Hot or iced. Needs creamer, oat milk, or similar."],
["Twinings Mango & Pineapple","Herbal","Tea bag","Tea Drawer","Full","Gentle","Like","Maybe","Fruity,Cozy","Year-round","Instant","Caffeine-free. Great in hot toddies with Drambuie."],
["Republic of Tea Moroccan Mint","Green","Loose leaf","Tea Drawer","¼","Avoid","Neutral","No","Classic,Uplifting","Warm weather","Easy","USEUP: Prefer Casablanca Twist with spearmint."],
["Adagio Peach & Blueberry Cobbler","Green blend","Loose leaf","Tea Drawer","½","Gentle","Like","Maybe","Fruity,Sweet,Fun","Summer","Easy","Gravitating toward it more lately.","~8 oz bulk backup"],
["Spiced Apple Chai","Chai blend","Loose leaf","Tea Drawer","½","Avoid","Favorite","Yes","Cozy,Spicy","Fall/Winter","Easy","Strong cool-weather favorite."],
["Harney Hot Cinnamon Spice","Black","Loose leaf","Tea Drawer","½","Avoid","Favorite","Yes","Cozy,Spicy","Late fall–early spring","Easy","Year-round; ranks higher late fall through early spring.","Bulk backup"],
["Harney Victorian London Fog","Black","Loose leaf","Tea Drawer","¼","Avoid","Like","Yes","Cozy,Classic","Cool weather","Easy","Finish soon. Add half-and-half or coffee creamer for latte feel."],
["Adagio Berry Creme Compote","Herbal","Loose leaf","Tea Cabinet","½","Gentle","Like","Maybe","Fruity,Sweet,Cozy","Year-round","Easy","Really good mixed with Harney Vanilla."],
["Adagio Pu-erh Chorange","Pu-erh","Loose leaf","Tea Cabinet","¾","Avoid","Like","Yes","Cozy,Sweet,Fun","Cool weather","Easy","Tastes like a Terry's Chocolate Orange. Smooth fermented pu-erh."],
["Republic of Tea Sweet Strawberry Matcha","Matcha blend","Powdered blend","Tea Cabinet","¼","Avoid","Matcha Favorite","Yes","Fruity,Sweet,Fun","Summer","A Few Steps","From World Market. Hot or iced; leans iced. Milk, creamer, or especially oat milk."]
].map(x=>({name:x[0],type:x[1],format:x[2],location:x[3],amount:x[4],gentle:x[5],pref:x[6],buy:x[7],moods:x[8].split(','),season:x[9],ease:x[10],notes:x[11],backstock:x[12]||"",useup:(x[11]||"").startsWith("USEUP:")}));
let teas=JSON.parse(localStorage.getItem("steepTeas")||"null")||D,hist=JSON.parse(localStorage.getItem("steepHist")||"{}"),cranky=false,sel=[];
function save(){localStorage.setItem("steepTeas",JSON.stringify(teas));localStorage.setItem("steepHist",JSON.stringify(hist))}
function tab(id,b){document.querySelectorAll("section").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");if(id==="shelf")shelf()}
function crank(){cranky=!cranky;document.getElementById("cranky").textContent=cranky?"💚 Cranky-stomach mode ON":"🌿 My stomach is cranky"}
function days(n){return hist[n]?(Date.now()-hist[n])/86400000:999}
function ss(t){let m=new Date().getMonth()+1,s=t.season.toLowerCase();return ((m>=10||m<=3)&&/(cool|winter|fall|spring)/.test(s))||((m>=5&&m<=9)&&/(summer|warm)/.test(s))?4:s.includes("year")?2:0}
function score(t){return ss(t)+Math.min(days(t.name)/20,7)+(t.pref.includes("Favorite")?3:0)+(t.useup?2:0)+(cranky&&t.gentle==="Go-To"?9:0)}
function pool(){return teas.filter(t=>t.amount!=="Finished"&&(!cranky||["Go-To","Gentle"].includes(t.gentle)))}
function pick(mode){let p=pool();if(mode==="mood"&&sel.length)p=p.filter(t=>sel.some(m=>t.moods.includes(m)));if(!p.length)return result("No tea matches those filters.");let t=mode==="wild"?p[Math.floor(Math.random()*p.length)]:mode==="different"?[...p].sort((a,b)=>days(b.name)-days(a.name))[0]:[...p].sort((a,b)=>score(b)-score(a))[0];result(`<div class="card pick"><div class="small">${mode==="wild"?"WILDCARD":mode==="different"?"SOMETHING DIFFERENT":"TODAY'S PICK"}</div><h3>${t.name}</h3><div class="meta">${t.type} · ${t.location} · ${t.amount}</div><p>${t.notes}</p><button onclick='drank(${JSON.stringify(t.name)})'>✓ I drank this</button></div>`)}
function result(x){document.getElementById("result").innerHTML=x}
function drank(n){hist[n]=Date.now();save();result(`<div class="card"><h3>Logged ☕</h3><p>${n} is back in the rotation.</p></div>`)}
function shelf(){let q=(document.getElementById("search").value||"").toLowerCase(),shown=teas.filter(t=>JSON.stringify(t).toLowerCase().includes(q));document.getElementById("list").innerHTML=shown.map(t=>`<div class="tea"><h3>${t.name}</h3><div class="meta">${t.type} · ${t.format} · 📍 ${t.location}</div><span class="badge">${t.amount}</span><span class="badge ${["Gentle","Go-To"].includes(t.gentle)?"green":""}">${t.gentle==="Go-To"?"💚 Go-To":t.gentle==="Gentle"?"🌿 Gentle":"Gentle: "+t.gentle}</span>${t.pref!=="Neutral"?`<span class="badge">⭐ ${t.pref}</span>`:""}${t.useup?'<span class="badge use">🎯 Use Up</span>':""}${t.backstock?`<span class="badge">📦 ${t.backstock}</span>`:""}<div class="small">${t.notes}</div><div class="qty">${["Full","¾","½","¼","Almost Gone","Finished"].map(a=>`<button onclick='qty(${JSON.stringify(t.name)},${JSON.stringify(a)})'>${a}</button>`).join("")}</div></div>`).join("")}
function qty(n,a){teas.find(t=>t.name===n).amount=a;save();shelf();attention()}
function attention(){let a=teas.filter(t=>t.useup||["¼","Almost Gone"].includes(t.amount));document.getElementById("attention").innerHTML=a.map(t=>`<div class="tea"><b>${t.name}</b><div class="meta">${t.useup?"🎯 Use Up":"📉 Finish Soon"} · ${t.amount}${t.backstock?" · "+t.backstock:""}</div></div>`).join("")||'<div class="small">Nothing urgent.</div>'}
let M=["Cozy","Sweet","Fruity","Spicy","Uplifting","Classic","Fun"];document.getElementById("moods").innerHTML=M.map(m=>`<button class="chip" onclick='mood(this,${JSON.stringify(m)})'>${m}</button>`).join("");function mood(b,m){b.classList.toggle("on");sel.includes(m)?sel=sel.filter(x=>x!==m):sel.push(m)}attention();
</script></body></html>
